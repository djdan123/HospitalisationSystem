# ============================================================
# HOSPITAL CLIENT - Configuration
# ============================================================

# Adresse de la machine serveur (où tournent les microservices gRPC)
grpc.server.host=192.168.1.10

# Ports des microservices gRPC (doivent correspondre au serveur)
grpc.accueil.port=50051
grpc.hospitalisation.port=50052
grpc.paiement.port=50053
grpc.consultation.port=50054
grpc.laboratoire.port=50055
grpc.pharmacie.port=50056
grpc.maternite.port=50057

# Timeout gRPC (secondes)
grpc.deadline.seconds=10

# Thème / titre
app.theme=light
app.title=Hospital Management System
app.version=1.0.0
